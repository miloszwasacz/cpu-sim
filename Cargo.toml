[workspace]
members = ["crates/build", "crates/derive"]

[workspace.dependencies]
convert_case = "0.8.0"
const_format = "0.2.34"
itertools = "0.14.0"
phf = { version = "0.12.1", default-features = false }
phf_codegen = "0.12.1"

[package]
name = "cpu-sim"
version = "0.1.0"
edition = "2024"
build = "crates/build/src/main.rs"

[features]
default = ["ui"]
ui = ["ratatui"]

[[bin]]
name = "cpu-sim"
required-features = ["ui"]

[dependencies]
cpu-sim-derive = { path = "crates/derive" }
const_format = { workspace = true }
itertools = { workspace = true }
bitflags = "2.9.1"
phf = { workspace = true, default-features = true, features = ["macros"] }
rand = "0.9.2"
elf = "0.8.0"
libc = "0.2.169"
ratatui = { version = "0.29.0", optional = true }

[build-dependencies]
const_format = { workspace = true }
convert_case = { workspace = true }
itertools = { workspace = true }
phf = { workspace = true }
phf_codegen = { workspace = true }
